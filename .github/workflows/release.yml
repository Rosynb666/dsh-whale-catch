name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动补发：Actions → Release → Run workflow → 填 tag（例如 v0.1.3）。
  # 标签已经推了但发布没成功时，不用再打一个空版本。
  # 也用于补附件：tag 下版本已在 npm 上时自动跳过 publish，只重建 Release 并附 .tgz。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.3）'
        required: true
        type: string

permissions:
  contents: write
  # Trusted Publishing 靠这个权限换 OIDC 令牌，不要删。
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 校验 tag 与 package.json 版本
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG 与 package.json 的 v$VERSION 不一致，拒绝发布"
            exit 1
          fi

      - run: npm ci
      - run: npm run verify

      - name: 打包预检
        run: npm pack --dry-run

      # 补发场景：版本早就发到 npm 了，只是 Release 缺 .tgz。
      # 先问一句 registry，已有版本就跳过 publish，只补附件，避免 403 把整个 job 打挂。
      - name: 检查 npm 是否已有该版本
        id: npm-version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-whale-catch@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::npm 上已有 dsh-whale-catch@$VERSION，跳过发布，只补 Release 附件"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 选择 npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing 需要 npm >= 11.5.2；runner 自带的版本偏旧。
      - name: 升级 npm（OIDC 需要 11.5.2+）
        if: steps.npm-version.outputs.exists != 'true'
        run: npm install -g 'npm@^11.5.2'

      # 优先走 Trusted Publishing：不读任何 secret，provenance 由 OIDC 签发。
      # 没在 npm 包设置里绑 GitHub 仓库时会失败，所以下一步留了 token 回落。
      - name: 发布到 npm（Trusted Publishing / OIDC）
        id: npm-oidc
        if: steps.npm-version.outputs.exists != 'true'
        continue-on-error: true
        run: npm publish --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: 回落：用 NPM_TOKEN 发布
        if: steps.npm-version.outputs.exists != 'true' && steps.npm-oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Trusted Publishing 未配置，仓库也没有 NPM_TOKEN 可回落，npm 发布未完成"
            exit 1
          fi
          echo "::warning::OIDC 发布失败，回落到 NPM_TOKEN（建议尽快在 npm 包设置里绑定 Trusted Publishing）"
          # setup-node 没配 registry-url，.npmrc 得自己写；否则 npm 读不到这个 token。
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm publish --provenance --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: 校验 npm 上真的出现了这个版本
        if: steps.npm-version.outputs.exists != 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 6); do
            if npm view "dsh-whale-catch@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::npm 上已确认 dsh-whale-catch@$VERSION"
              exit 0
            fi
            echo "等待 npm 传播（$i/6）…"
            sleep 10
          done
          echo "::error::npm 发布后校验失败：dsh-whale-catch@$VERSION 不在 registry 上"
          exit 1

      - name: 生成 npm tarball（附到 Release）
        run: npm pack

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dsh-whale-catch-*.tgz
