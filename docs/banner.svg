<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">深海鱼篓 · Whale Catch</title>
  <desc id="desc">把本场会话的交付物收进一个篮子：零登记、就地预览、行内差异、交付体检、zip 与回执。</desc>
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03131d"/>
      <stop offset=".48" stop-color="#062331"/>
      <stop offset="1" stop-color="#082c3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 70) rotate(120) scale(420 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54f4d4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#54f4d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(700 340) rotate(-35) scale(380 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59a8ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#59a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="-138" x2="0" y2="138" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b3850"/>
      <stop offset="1" stop-color="#061b28"/>
    </linearGradient>
    <linearGradient id="whale" x1="-80" y1="-60" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17617e"/>
      <stop offset="1" stop-color="#0b3650"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54f4d4"/>
      <stop offset="1" stop-color="#59a8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7e6f4" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#deep)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow2)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M0 300C128 266 214 330 348 298C474 268 552 214 682 236C807 257 866 327 996 294C1090 270 1146 252 1200 262" stroke="#54f4d4" stroke-opacity=".12" stroke-width="1.4"/>
    <path d="M0 314C150 282 228 338 382 306C512 280 574 236 700 254C824 272 890 336 1018 306C1108 285 1160 266 1200 274" stroke="#59a8ff" stroke-opacity=".08" stroke-width="1"/>
  </g>

  <rect x="48" y="84" width="5" height="80" rx="2.5" fill="url(#accent)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="73" y="76" fill="#66e7d0" font-size="12" font-weight="600" letter-spacing="3">DEEPSEEK HARNESS · WHALE CATCH</text>
    <text x="70" y="170" fill="#f5fcff" font-size="80" font-weight="800" letter-spacing="2">深海鱼篓</text>
    <text x="73" y="211" fill="#c8dce7" font-size="25" font-weight="500" letter-spacing=".3">让本场会话的交付物，自己游进篮子。</text>
    <text x="73" y="240" fill="#7c9aab" font-family="'SFMono-Regular',Consolas,monospace" font-size="12.5" letter-spacing=".15">Every deliverable from this session, one basket.</text>

    <g transform="translate(73 266)">
      <rect width="100" height="31" rx="15.5" fill="#0c2d3c" stroke="#54f4d4" stroke-opacity=".3"/>
      <circle cx="16" cy="15.5" r="3" fill="#54f4d4"/>
      <text x="28" y="20.5" fill="#b9ece1" font-size="12">零登记</text>

      <g transform="translate(112 0)">
        <rect width="112" height="31" rx="15.5" fill="#0c2d3c" stroke="#59a8ff" stroke-opacity=".28"/>
        <circle cx="16" cy="15.5" r="3" fill="#59a8ff"/>
        <text x="28" y="20.5" fill="#c2dbf4" font-size="12">行内差异</text>
      </g>

      <g transform="translate(236 0)">
        <rect width="112" height="31" rx="15.5" fill="#0c2d3c" stroke="#f0b86e" stroke-opacity=".28"/>
        <circle cx="16" cy="15.5" r="3" fill="#f0b86e"/>
        <text x="28" y="20.5" fill="#f0d5ad" font-size="12">交付体检</text>
      </g>

      <g transform="translate(360 0)">
        <rect width="124" height="31" rx="15.5" fill="#0c2d3c" stroke="#ff9fba" stroke-opacity=".24"/>
        <circle cx="16" cy="15.5" r="3" fill="#ff9fba"/>
        <text x="28" y="20.5" fill="#f1c9d5" font-size="12">zip / 回执</text>
      </g>
    </g>

    <text x="73" y="326" fill="#5c7d90" font-size="11.5" letter-spacing=".4">MIT · Rosynb666</text>
    <text x="1128" y="326" fill="#5c7d90" font-size="11.5" text-anchor="end" letter-spacing=".4">v0.4.0  /  zero build  /  one runtime dep</text>
  </g>

  <g transform="translate(990 160)">
    <circle r="138" fill="url(#sea)" stroke="#b7e6f4" stroke-opacity=".1"/>
    <circle r="122" fill="none" stroke="#54f4d4" stroke-opacity=".12" stroke-dasharray="2 9"/>
    <circle r="152" fill="none" stroke="#59a8ff" stroke-opacity=".06"/>

    <g fill="none" stroke="#7fe3e3" stroke-linecap="round">
      <path d="M-112 -52C-86 -66 -58 -66 -34 -54" stroke-opacity=".12"/>
      <path d="M-120 38C-96 22 -68 18 -44 28" stroke-opacity=".1"/>
    </g>

    <g transform="translate(7 -22)">
      <path d="M-78 0C-70 -37 -33 -60 9 -53C48 -46 74 -20 82 7C61 33 27 48 -10 41C-45 34 -70 20 -78 0Z" fill="url(#whale)" stroke="#7fe3e3" stroke-opacity=".38"/>
      <path d="M-73 -1C-97 -15 -116 -9 -130 12C-110 26 -86 28 -68 13Z" fill="#0b3a52" stroke="#7fe3e3" stroke-opacity=".3"/>
      <path d="M-9 26C-17 43 -7 56 10 51C18 41 11 30 4 22Z" fill="#092c42"/>
      <path d="M-44 -14C-16 -27 14 -27 42 -16" fill="none" stroke="#62a9bd" stroke-opacity=".35"/>
      <path d="M-70 4C-58 10 -48 15 -34 18" fill="none" stroke="#7fe3e3" stroke-opacity=".35" stroke-linecap="round"/>
      <circle cx="47" cy="-18" r="3.2" fill="#d7fff8"/>
      <circle cx="47" cy="-18" r="1.5" fill="#07222f"/>
      <path d="M7 -53C2 -80 -3 -94 -9 -108M19 -52C24 -81 31 -93 39 -105" fill="none" stroke="#7fe3e3" stroke-opacity=".38" stroke-linecap="round"/>
      <circle cx="-9" cy="-112" r="2.2" fill="#7fe3e3" opacity=".5"/>
      <circle cx="41" cy="-109" r="1.8" fill="#7fe3e3" opacity=".4"/>
    </g>

    <g transform="translate(34 77)">
      <path d="M-46 0H46L38 45H-38Z" fill="#e8dcc4" stroke="#f7efdd" stroke-opacity=".7"/>
      <ellipse cx="0" cy="0" rx="46" ry="11" fill="#fff8ea"/>
      <ellipse cx="0" cy="0" rx="35" ry="6.5" fill="#0b2b3b" fill-opacity=".65"/>
      <path d="M-40 10H40M-36 20H36M-32 30H32M-28 40H28" stroke="#b99b6b" stroke-opacity=".5" stroke-width="1.4"/>
      <g transform="translate(-8 -13) rotate(-8)">
        <rect width="36" height="46" rx="4" fill="#f7fbff" stroke="#c6d9e9" stroke-width="1"/>
        <path d="M26 0H36V10Z" fill="#c6d9e9"/>
        <rect x="7" y="12" width="20" height="3" rx="1.5" fill="#b7cadb"/>
        <rect x="7" y="20" width="14" height="3" rx="1.5" fill="#d4e1ec"/>
        <path d="M7 34L13 28L18 32L25 24" fill="none" stroke="#54c7b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <circle cx="-117" cy="-88" r="2.4" fill="#54f4d4" opacity=".45"/>
    <circle cx="111" cy="-76" r="2.4" fill="#59a8ff" opacity=".4"/>
    <circle cx="118" cy="90" r="2.4" fill="#f0b86e" opacity=".35"/>
  </g>
</svg>
