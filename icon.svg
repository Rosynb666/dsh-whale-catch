      <stop offset="0" stop-color="#1d4e89"/>
      <stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e8dcc4"/>
